<title>Movemory Monde 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Écran de jeu mobile d'abord : une colonne de 480px max, carte du monde puis séance plein écran. Thème sombre assumé. */
:root {
  --bg: #14121C; --bg-2: #0F0D16; --surface: #221F2E; --surface-2: #2E2A3D; --line: #3E3952;
  --fg: #FFFFFF; --muted: #B8B4C8;
  --accent: #1A9E4B; --accent-edge: #11703A; --gold: #FFC94A; --gold-edge: #B88A1A;
  --good: #3DDC84; --bad: #F0605D; --hint: #8FD3FF;
  --sq-light: #F2E8D5; --sq-dark: #6D8FB3;
  --world-a: #8A4A2A; --world-b: #7A3F22;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; overflow-x: clip; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Boutons de jeu */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; padding: 14px 18px; font-family: var(--display); font-weight: 600; font-size: 18px; cursor: pointer; background-color: var(--surface-2); border-bottom: 5px solid #0A0910; background-image: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.05) 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.08)); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 10px 18px -8px rgba(0,0,0,.6); transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(3px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-cta { background-color: var(--accent); border-bottom-color: var(--accent-edge); text-transform: uppercase; letter-spacing: .8px; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.btn-gold { background-color: var(--gold); border-bottom-color: var(--gold-edge); color: #3A2A05; }
.btn-ghost { background: transparent; border: 2px solid var(--line); border-bottom-width: 5px; box-shadow: none; }

/* ---------- Carte du monde ---------- */
.map { position: relative; height: 100vh; height: 100dvh; min-height: 620px; display: flex; flex-direction: column; overflow: hidden; }
.map-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.map-bg::before { content: ""; position: absolute; left: -60%; top: -40%; width: 220%; height: 180%; background: conic-gradient(var(--world-a) 25%, var(--world-b) 0 50%, var(--world-a) 0 75%, var(--world-b) 0); background-size: 112px 112px; transform: scaleY(.58) rotate(45deg); }
.map-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 50%, rgba(0,0,0,0) 40%, rgba(20,8,4,.6) 100%); }
.hud { position: relative; z-index: 2; margin: 0 10px; padding: 12px 12px 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: rgba(15,13,22,.9); border-radius: 0 0 22px 22px; display: grid; gap: 10px; }
.hud-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 20px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-weight: 600; font-size: 16px; }
.world-title { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg-2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; border-radius: 9px; padding: 8px; background: transparent; color: var(--muted); font-family: var(--display); font-weight: 600; font-size: 14px; cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--surface-2); color: var(--fg); }
.bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--gold); transition: width .5s; }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
.bar-row .bar { flex: 1; }
.path { position: relative; z-index: 1; flex: 1; min-height: 0; }
.track { position: absolute; inset: 0; }
.milestone { position: absolute; z-index: 3; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; color: var(--fg); }
button.milestone { cursor: pointer; } button.milestone:disabled { cursor: default; opacity: .55; }
.milestone.ready svg { animation: bob 1.4s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,201,74,.7)); }
.flag { font-family: var(--display); font-weight: 600; font-size: 12px; background: rgba(15,13,22,.85); border-radius: 8px; padding: 2px 8px; }
.tile { position: absolute; width: 110px; height: 90px; border: 0; padding: 0; background: none; cursor: pointer; }
.tile svg { position: absolute; inset: 0; }
.tile:disabled { cursor: default; }
.tile .num { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 24px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
.tile-label { position: absolute; z-index: 3; transform: translateX(-50%); white-space: nowrap; font-size: 12px; font-weight: 800; background: rgba(15,13,22,.85); border-radius: 8px; padding: 2px 8px; pointer-events: none; }
.tile-label.punish { color: #FFB4A5; }
.tile.current .ring { position: absolute; left: 50%; top: 36px; width: 104px; height: 60px; margin: -30px 0 0 -52px; border-radius: 50%; border: 4px solid var(--gold); animation: ring 1.6s ease-out infinite; }
@keyframes ring { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
.memo-token { position: absolute; z-index: 4; width: 84px; height: 84px; pointer-events: none; animation: bob 1.5s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.map-foot { position: relative; z-index: 5; display: grid; gap: 10px; justify-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(20,18,28,0), rgba(20,18,28,.92) 35%, var(--bg) 70%); }
.play { width: 92px; height: 92px; border-radius: 50%; padding: 0; font-size: 0; }
.play-wrap { position: relative; display: grid; place-items: center; width: 108px; height: 108px; border-radius: 50%; }
.play-label { font-family: var(--display); font-weight: 600; font-size: 15px; background: #fff; color: #14121C; border-radius: 999px; padding: 5px 14px; box-shadow: 0 4px 0 #C9C3B8; }
.test-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-weight: 700; flex-wrap: wrap; justify-content: center; }
.test-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-weight: 700; font-size: 13px; padding: 6px; }

/* ---------- Séance ---------- */
.session { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.s-top { display: flex; align-items: center; gap: 12px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.s-top .bar { flex: 1; height: 16px; }
.s-top .bar > span { background: var(--accent); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.22); }
.combo { font-family: var(--display); font-weight: 700; color: var(--gold); min-width: 40px; text-align: right; }
.combo.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.5); } }
.s-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.eyebrow { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.s-name { font-family: var(--display); font-weight: 600; font-size: 20px; }
.pill { background: var(--surface-2); border-radius: 10px; padding: 5px 10px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.pill.punish { background: #4A2430; color: #FFB4A5; }
.coach { display: flex; gap: 8px; align-items: flex-start; min-height: 86px; }
.coach .memo { flex: none; width: 70px; height: 70px; margin-top: -4px; }
.bubble { flex: 1; min-width: 0; background: var(--surface); border-radius: 4px 16px 16px 16px; padding: 10px 14px; animation: pop .35s ease-out both; }
.bubble b.who { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #7EE2A2; }
.bubble p { margin: 2px 0 0; line-height: 1.4; font-weight: 700; }
@keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }

.board-wrap { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1; margin: 0 auto; border-radius: 8px; overflow: hidden; box-shadow: 0 6px 0 #0A0910; touch-action: none; user-select: none; -webkit-user-select: none; }
.board-wrap.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.sq { position: relative; }
.sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
.sq.last.l { background: #F3E08A; } .sq.last.d { background: #C7A94A; }
.sq.sel.l, .sq.sel.d { background: #F6D365; }
.sq.good.l { background: #B8E6C4; } .sq.good.d { background: #5DBB7A; }
.sq.hint::after { content: ""; position: absolute; inset: 6%; border-radius: 50%; border: 4px solid var(--hint); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.85); opacity: .6; } }
.sq.dot::before { content: ""; position: absolute; left: 50%; top: 50%; width: 28%; height: 28%; margin: -14% 0 0 -14%; border-radius: 50%; background: rgba(20,18,28,.28); }
.sq.cap::before { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid rgba(20,18,28,.28); }
.coord { position: absolute; font-size: 10px; font-weight: 800; font-family: var(--display); }
.coord.r { left: 3px; top: 1px; } .coord.f { right: 3px; bottom: 0; }
.sq.l .coord { color: #56769A; } .sq.d .coord { color: var(--sq-light); }
.pieces { position: absolute; inset: 0; pointer-events: none; }
.pc { position: absolute; width: 12.5%; height: 12.5%; display: grid; place-items: center; font-family: "DejaVu Sans", "Segoe UI Symbol", "Noto Sans Symbols 2", sans-serif; line-height: 1; transition: transform .22s ease; will-change: transform; }
.pc.w { color: #fff; text-shadow: 0 0 1.5px #1A1A1A, 0 0 1.5px #1A1A1A, 0 2px 1px rgba(0,0,0,.35); }
.pc.b { color: #2A2725; text-shadow: 0 0 1px rgba(255,255,255,.3), 0 2px 1px rgba(0,0,0,.3); }
.pc.drag { transition: none; z-index: 5; }
.arrows { position: absolute; inset: 0; pointer-events: none; }
.moves { display: flex; flex-wrap: wrap; gap: 4px 8px; font-weight: 800; font-size: 14px; color: var(--muted); min-height: 20px; }
.moves .cur { color: var(--fg); background: var(--surface-2); border-radius: 6px; padding: 0 6px; }
.s-actions { display: flex; gap: 10px; margin-top: auto; }
.s-actions .btn { flex: 1; }

.sheet { position: fixed; left: 50%; bottom: 0; z-index: 20; width: 100%; max-width: 480px; transform: translateX(-50%); background: var(--surface); border-top: 4px solid var(--good); border-radius: 22px 22px 0 0; padding: 18px 18px 22px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: max(22px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; box-shadow: 0 -12px 30px rgba(0,0,0,.45); animation: up .35s cubic-bezier(.2,.9,.3,1.15) both; }
.sheet.bad { border-top-color: var(--bad); }
@keyframes up { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.badge { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--good); color: #08331A; }
.sheet.bad .badge { background: var(--bad); color: #fff; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 21px; }
.sheet p { margin: 0; line-height: 1.45; font-weight: 700; }
.sheet .note { color: var(--muted); font-size: 14px; }
.sheet .memo { position: absolute; right: 12px; top: -78px; width: 90px; height: 90px; }
.sheet .row { display: flex; gap: 10px; }
.sheet .row .btn { flex: 1; }
.xp-float { position: absolute; z-index: 6; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 #6B4E0A; pointer-events: none; animation: xp 1.4s ease-out forwards; }
@keyframes xp { from { transform: translateY(8px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-50px); opacity: 0; } }

/* ---------- Fin ---------- */
.end { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 40px 20px 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); text-align: center; }
.end .memo { width: 140px; height: 140px; animation: pop .6s both; }
.end h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; color: var(--gold); text-wrap: balance; }
.end p { margin: 0; color: var(--muted); font-weight: 700; max-width: 34ch; line-height: 1.45; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.stat { border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
.stat span { display: block; padding: 4px; font-size: 12px; font-weight: 800; text-transform: uppercase; background: var(--surface-2); color: var(--muted); }
.stat b { display: block; padding: 10px 0; font-family: var(--display); font-size: 24px; }
.mastery { width: 100%; background: var(--surface); border-radius: 18px; padding: 14px; display: grid; gap: 8px; text-align: left; }
.m-row { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; }
.m-row .name { flex: 1; min-width: 0; }
.pips { display: flex; gap: 4px; }
.pips i { width: 14px; height: 14px; border-radius: 4px; background: var(--surface-2); }
.pips i.on { background: var(--gold); }
.pips i.lv1 { background: #8A6E2A; } .pips i.lv2 { background: var(--gold); } .pips i.lv3 { background: var(--good); }
.seg-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.seg-bar span { display: block; height: 100%; transition: width .5s; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.lines-state { width: 100%; display: grid; gap: 8px; text-align: left; background: var(--surface); border-radius: 18px; padding: 14px; }
.end .link-btn { margin-top: -8px; }
.end .btn { width: 100%; margin-top: auto; }
.conf { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall 3s linear infinite; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app">
  <section class="map" id="screen-map" aria-label="Carte du monde 1">
    <div class="map-bg"></div>
    <header class="hud">
      <div class="hud-top">
        <span class="brand">Movemory</span>
        <span class="chip" style="color:#FFB054" title="Série de jours">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.5 2c.6 3.6 5.5 5.6 5.5 11a6 6 0 0 1-12 0c0-2.6 1.3-4.4 2.6-5.4.1 2 1.1 3.3 2.4 3.6-.6-3.3.1-6.6 1.5-9.2z"/></svg><span id="streak">1</span>
        </span>
        <span class="chip" style="color:var(--gold)" title="Points d'expérience">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z"/></svg><span id="xp">0</span> XP
        </span>
        <span class="chip" style="color:#8FD3FF" title="Gemmes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"/></svg><span id="gems">0</span>
        </span>
      </div>
      <div class="seg" role="tablist" aria-label="Répertoire">
        <button role="tab" id="rep-w" data-rep="w">Blancs · Italienne</button>
        <button role="tab" id="rep-b" data-rep="b">Noirs · Sicilienne</button>
      </div>
      <div class="world-title" id="world-title"></div>
      <div class="bar-row"><div class="bar"><span id="world-bar" style="width:0%"></span></div><span id="world-count">0/7</span></div>
    </header>
    <div class="path" id="path"></div>
    <footer class="map-foot">
      <span class="play-label" id="play-label">Commencer</span>
      <div class="play-wrap" id="play-ring">
        <button class="btn btn-cta play" id="play" aria-label="Jouer la prochaine étape">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
      </div>
      <div class="test-row">
        <label><input type="checkbox" id="unlock"> Mode test : tout débloquer</label>
        <button class="link-btn" id="reset">Remettre à zéro</button>
      </div>
    </footer>
  </section>

  <section class="session" id="screen-session" hidden aria-label="Séance">
    <div class="s-top">
      <button class="icon-btn" id="quit" aria-label="Quitter la séance"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="bar" role="progressbar" aria-label="Progression de la séance"><span id="s-bar" style="width:0%"></span></div>
      <span class="combo" id="combo" aria-label="Combo">x0</span>
    </div>
    <div class="s-title">
      <div><div class="eyebrow" id="s-eyebrow">Monde 1 · Blancs</div><div class="s-name" id="s-name">Partie italienne</div></div>
      <span class="pill" id="s-pill">Coup 1</span>
    </div>
    <div class="coach">
      <div class="memo" id="coach-memo"></div>
      <div class="bubble" id="bubble"><b class="who">Memo</b><p id="bubble-text"></p></div>
    </div>
    <div class="board-wrap" id="board">
      <div class="squares" id="squares"></div>
      <svg class="arrows" id="arrows" viewBox="0 0 800 800" aria-hidden="true"></svg>
      <div class="pieces" id="pieces"></div>
    </div>
    <div class="moves" id="moves" aria-label="Coups joués"></div>
    <div class="s-actions">
      <button class="btn" id="btn-hint"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Indice</button>
      <button class="btn" id="btn-solution"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--hint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Solution</button>
    </div>
  </section>

  <section class="end" id="screen-end" hidden aria-label="Fin de séance"></section>
</div>
<div id="sheet-host"></div>

<script type="module">
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm';

const CONTENT = /*CONTENT*/null;

/* ---------- Mascotte Memo (échiquier à lunettes) ---------- */
function memoSvg(mood = 'content') {
  const poses = {
    content: ['M21 58 Q10 64 9 76', [9, 78], 'M99 52 Q110 46 110 32', [110, 29]],
    reflechit: ['M21 60 Q10 72 22 80 L34 76', [36, 75], 'M99 58 Q110 64 111 76', [111, 78]],
    bravo: ['M21 50 Q8 40 10 24', [10, 21], 'M99 50 Q112 40 110 24', [110, 21]],
    oups: ['M21 52 Q8 36 20 14 L28 10', [30, 9], 'M99 58 Q110 64 111 76', [111, 78]],
  };
  const brows = { content: 'M37 29 q9 -5 18 0 M65 29 q9 -5 18 0', reflechit: 'M37 27 q9 -6 18 -1 M65 31 q9 -1 18 0', bravo: 'M37 26 q9 -7 18 0 M65 26 q9 -7 18 0', oups: 'M37 27 q9 3 18 6 M65 33 q9 -3 18 -6' };

  $('s-eyebrow').textContent = opts.boss ? 'Défi final · sans indice' : `Monde 1 · ${SIDE === 'w' ? 'Blancs' : 'Noirs'}`;
  $('btn-hint').disabled = $('btn-solution').disabled = !!opts.boss;
  if (opts.boss) { S.queue = shuffle(TILES).map((t) => ({ kind: 'partie', t, boss: true })); S.total = S.queue.length; return nextItem(); }
  // on reprend les lignes commencées et pas encore maîtrisées ; sinon on révise tout ce qui est appris
  S.introduced = 0;
  S.lines = TILES.filter((t) => tileSeen(t) && !tileMastered(t));
  if (!S.lines.length && !TILES.some((t) => !tileSeen(t))) S.lines = TILES.filter(tileSeen);
  nextRound();
}
function lessonCards() { const ks = new Set(); for (const t of S.lines) t.cards.forEach((k) => ks.add(k)); return [...ks]; }
function updateBar() {
  if (!S) return;
  if (S.opts.boss) { $('s-bar').style.width = `${(S.done || 0) / S.total * 100}%`; return; }
  const ks = lessonCards(); const sum = ks.reduce((n, k) => n + card(k).level, 0);
  $('s-bar').style.width = `${ks.length ? (sum / (ks.length * MAXL)) * 100 : 0}%`;
}
function nextRound() {
  S.round++; S.queue = buildRound(); S.total = S.queue.length; S.done = 0;
  if (!S.queue.length) return endSession();
  nextItem();
}
async function nextItem() {
  updateBar();
  if (!S.queue.length) return S.opts.boss ? endSession() : checkpoint();
  const it = S.queue.shift(); S.item = it;
  game = new Chess(); S.lastOpp = ''; renderPieces(); sqClass('last', []); sqClass('hint', []); arrow(null); renderMoves();
  const pillTxt = it.boss ? `Partie ${S.total - S.queue.length}/${S.total}` : `Manche ${S.round} · ${S.total - S.queue.length}/${S.total}`;
  $('s-pill').textContent = pillTxt; $('s-pill').classList.toggle('punish', false);
  if (it.kind === 'partie') {
    $('s-name').textContent = it.boss ? 'Défi final' : 'En partie';
    say(it.boss ? 'Défi final : pas d’indice, pas d’erreur !' : 'En partie : je choisis une ouverture au hasard. À vous de la reconnaître !', 'reflechit');
    it.from = DEBUT; it.to = it.t.to;
    await wait(650); return playOn();
  }
  $('s-name').textContent = (it.level === 0 ? 'Découverte' : 'De mémoire') + ' · ' + it.t.name;
  if (it.level === 0 && S.newLine === it.t && it.ply === Math.min(...it.t.cards.filter((k) => card(k).level === 0).map((k) => plyOf(it.t, k)))) {
    say(`Nouvelle ligne : <b>${it.t.name}</b>. ${it.t.alerte ? it.t.alerte + ' ' : ''}Je vous la montre.`, 'content'); await wait(1300);
  }
  // mise en place rapide de la position, puis question
  it.from = it.ply; it.to = it.ply + 1;
  for (let i = 0; i < it.ply; i++) { await wait(i < DEBUT ? 120 : 200); animate(game.move(it.t.moves[i].san)); renderMoves(true); }
  playOn();
}
async function playOn() {
  const it = S.item; const ply = game.history().length;
  if (ply >= it.to) { S.done++; return nextItem(); }
  const move = it.t.moves[ply];
  if (game.turn() !== SIDE || ply < it.from) {
    await wait(ply < it.from ? 220 : 600);
    animate(game.move(move.san)); renderMoves(true);
    const who = SIDE === 'w' ? 'Les Noirs jouent' : 'Les Blancs jouent';
    S.lastOpp = `${who} <b>${label(ply, move.san)}</b>. ${move.pourquoi}`;
    if (it.kind === 'partie' && game.history().length < it.to) say(`${who} <b>${label(ply, move.san)}</b>. À vous !`, 'reflechit');
    return playOn();
  }
  ask(ply, move);
}
function ask(ply, move) {
  const it = S.item; const k = fenKey(game.fen()); const cs = card(k);
  const level = it.kind === 'partie' ? 2 : it.level;
  S.q = { ply, move, k, cs, level, help: false };
  const mv = new Chess(game.fen()).move(move.san);
  const prevMove = ply > 0 ? `${SIDE === 'w' ? 'Les Noirs ont joué' : 'Les Blancs ont joué'} <b>${label(ply - 1, game.history()[ply - 1])}</b>. ` : '';
  if (level === 0) {
    arrow(mv.from, mv.to, '#3E86C8'); S.q.help = true;
    say(`${S.lastOpp ? S.lastOpp + '<br>' : ''}Nouveau coup : jouez <b>${label(ply, move.san)}</b> (flèche bleue).`, 'content');
  } else if (it.kind !== 'partie') say(`${prevMove}À vous, de mémoire ! (besoin d'aide ? Indice)`, 'reflechit');
  inputEnabled = true; renderMoves(true);
  onUserMove = (m) => answer(m);
}
function answer(m) {
  const { ply, move, cs, level } = S.q; const it = S.item;
  inputEnabled = false; onUserMove = null; arrow(null); sqClass('hint', []);
  if (m.san !== move.san) {
    S.errors++; setCombo(0); const fell = cs.level > 1; cs.level = cs.level === 0 ? 0 : Math.max(1, cs.level - 1); save(); updateBar();
    $('board').classList.remove('shake'); void $('board').offsetWidth; $('board').classList.add('shake');
    const mv = new Chess(game.fen()).move(m.san); const el = pieceEls.get(mv.from);
    if (el) { placePiece(el, mv.to); setTimeout(() => placePiece(el, mv.from), 380); }
    const good = new Chess(game.fen()).move(move.san);
    setTimeout(() => arrow(good.from, good.to, '#3DDC84'), 400);
    if (it.boss) return sheet({ bad: true, title: 'Défi raté', text: `<b>Memo :</b> ici, c'était <b>${label(ply, move.san)}</b>. ${move.pourquoi}`, note: 'Révisez encore un peu, puis retentez le défi.', mood: 'oups', buttons: [['Retour à la carte', 'btn-cta', () => show('map')]] });
    // la question reviendra en fin de manche, un niveau plus bas
    if (it.kind === 'pos') S.queue.push({ ...it, level: cs.level }); else S.queue.push({ kind: 'pos', k: S.q.k, t: it.t, ply, level: cs.level });
    return sheet({ bad: true, title: 'Pas votre ligne !', text: `<b>Memo :</b> ${fr(m.san)} n'est pas le coup prévu. Ici on joue <b>${label(ply, move.san)}</b> : ${lower(move.pourquoi)}`, note: `${fell ? 'Memo recule d’un pas. ' : ''}Cette position revient à la fin de la manche.`, mood: 'oups', buttons: [['Rejouer le bon coup', 'btn-cta', () => { closeSheet(); retry(); }]] });
  }
  const played = game.move(m.san); animate(played); renderMoves(true);
  S.correct++; setCombo(S.combo + 1);
  const before = cs.level;
  // +1 niveau par réussite sans indice (Memo avance d'un pas) ; « maîtrisée » ne s'obtient qu'en partie
  const cap = it.kind === 'partie' ? MAXL : 2;
  if (!S.q.usedHint) cs.level = Math.min(cap, cs.level + 1);
  if (level === 0) cs.level = Math.max(cs.level, 1);
  save(); updateBar();
  const gain = level === 0 ? 5 : 10 + level * 2 + Math.min(S.combo, 5); S.xp += gain; floatXp(gain, played.to);
  if (level === 0) return sheet({ bad: false, title: 'C’est noté !', text: `<b>Memo :</b> ${move.pourquoi}`, note: '', mood: 'bravo', buttons: [['Continuer', 'btn-cta', () => { closeSheet(); playOn(); }]] });
  sqClass('good', [played.to]);
  say((cs.level === MAXL && before < MAXL ? 'Maîtrisée ! ⭐ ' : pick(['Bien joué ! ', 'Exact ! ', 'Parfait ! ', 'Oui ! '])) + (cs.level > before ? 'Memo avance d’un pas.' : ''), 'bravo');
  setTimeout(() => { sqClass('good', []); playOn(); }, 800);
}
function retry() {
  const { ply, move } = S.q; const good = new Chess(game.fen()).move(move.san); arrow(good.from, good.to, '#3DDC84');
  say(`Jouez <b>${label(ply, move.san)}</b> pour continuer.`, 'content');
  inputEnabled = true;
  onUserMove = (m) => {
    if (m.san !== move.san) { $('board').classList.remove('shake'); void $('board').offsetWidth; $('board').classList.add('shake'); return; }
    inputEnabled = false; onUserMove = null; arrow(null); animate(game.move(m.san)); renderMoves(true); playOn();
  };
}
$('btn-hint').addEventListener('click', () => {
  if (!inputEnabled || !S?.q) return; S.q.usedHint = true; const mv = new Chess(game.fen()).move(S.q.move.san); sqClass('hint', [mv.from]);
  say('Indice : cette pièce-là. Où doit-elle aller ?', 'content');
});
$('btn-solution').addEventListener('click', () => {
  if (!inputEnabled || !S?.q) return; S.q.usedHint = true; const mv = new Chess(game.fen()).move(S.q.move.san); arrow(mv.from, mv.to, '#3E86C8');
  say(`La solution : <b>${label(S.q.ply, S.q.move.san)}</b>. ${S.q.move.pourquoi}`, 'content');
});
$('quit').addEventListener('click', () => { inputEnabled = false; show('map'); });

// Bilan entre deux manches (comme les « points d'étape » de Quizlet)
function statusCounts() {
  const ks = lessonCards(); const c = { vu: 0, cours: 0, ok: 0 };
  for (const k of ks) { const l = card(k).level; if (l === 0) c.vu++; else if (l < MAXL) c.cours++; else c.ok++; }
  return { ...c, n: ks.length };
}
function statusBlock() {
  const c = statusCounts(); const pct = (x) => (x / c.n) * 100;
  return `<div class="mastery">
    <div class="seg-bar"><span style="width:${pct(c.ok)}%;background:var(--good)"></span><span style="width:${pct(c.cours)}%;background:var(--gold)"></span><span style="width:${pct(c.vu)}%;background:var(--surface-2)"></span></div>
    <div class="m-row"><span class="legend-dot" style="background:var(--good)"></span><span class="name">Maîtrisées</span><b>${c.ok}</b></div>
    <div class="m-row"><span class="legend-dot" style="background:var(--gold)"></span><span class="name">En apprentissage</span><b>${c.cours}</b></div>
    <div class="m-row"><span class="legend-dot" style="background:var(--surface-2)"></span><span class="name">Pas encore vues</span><b>${c.vu}</b></div>
  </div>`;
}
function checkpoint() {
  inputEnabled = false;
  const c = statusCounts();
  if (c.ok === c.n) return endSession();
  $('screen-end').innerHTML = `<div class="memo">${memoSvg('content')}</div>
    <h1>Manche ${S.round} terminée</h1>
    <p>${c.ok ? `Déjà ${c.ok} position${c.ok > 1 ? 's' : ''} maîtrisée${c.ok > 1 ? 's' : ''} sur ${c.n}. ` : ''}${TILES.some((t) => !tileSeen(t)) && S.introduced < NEW_PER_LESSON ? 'Une nouvelle ligne arrivera dès que celles-ci seront presque sues.' : 'On continue jusqu’à tout maîtriser !'}</p>
    ${statusBlock()}
    <div class="lines-state">${S.lines.map((t) => `<div class="m-row"><span class="name">${t.punish ? '⚔ ' : t.deviation ? '↪ ' : ''}${t.name}</span><span class="pips">${t.cards.map((k) => `<i class="lv${card(k).level}" title="${LEVELS[card(k).level]}"></i>`).join('')}</span></div>`).join('')}</div>
    <button class="btn btn-cta" id="end-continue">Manche suivante</button>
    <button class="link-btn" id="end-stop">Arrêter pour aujourd'hui</button>`;
  show('end');
  $('end-continue').addEventListener('click', () => { show('session'); buildSquares(); nextRound(); });
  $('end-stop').addEventListener('click', () => endSession(true));
}
function floatXp(n, sq) {
  const [x, y] = sqXY(sq); const el = document.createElement('div'); el.className = 'xp-float'; el.textContent = `+${n} XP`;
  el.style.left = `${x * 12.5}%`; el.style.top = `${y * 12.5}%`; $('board').appendChild(el); setTimeout(() => el.remove(), 1500);
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const lower = (s) => s.charAt(0).toLowerCase() + s.slice(1);

function sheet({ bad, title, text, note, mood, buttons }) {
  const host = $('sheet-host');
  host.innerHTML = `<div class="sheet ${bad ? 'bad' : ''}" role="status" aria-live="polite">
    <div class="memo">${memoSvg(mood)}</div>
    <div class="sheet-head"><span class="badge">${bad ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>' : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'}</span><h2>${title}</h2></div>
    <p>${text}</p>${note ? `<p class="note">${note}</p>` : ''}
    <div class="row">${buttons.map(([t, cls], i) => `<button class="btn ${cls}" data-i="${i}">${t}</button>`).join('')}</div></div>`;
  host.querySelectorAll('button').forEach((b) => b.addEventListener('click', buttons[b.dataset.i][2]));
  host.querySelector('button')?.focus();
  updateBar();
}
function closeSheet() { $('sheet-host').innerHTML = ''; }

function endSession(stopped) {
  inputEnabled = false;
  const boss = S.opts.boss;
  if (boss && S.errors === 0) { P.boss = true; S.xp += 100; P.gems += 50; }
  P.xp += S.xp; save();
  const acc = S.correct + S.errors ? Math.round((S.correct / (S.correct + S.errors)) * 100) : 100;
  const newly = TILES.filter((t) => tileMastered(t) && !S.masteredBefore.has(t.id));
  const conf = (boss && P.boss) || newly.length ? Array.from({ length: 10 }, (_, i) => `<span class="conf" style="left:${8 + i * 9}%;background:${['#FFC94A', '#3DDC84', '#8FD3FF', '#F0605D', '#A78BFA'][i % 5]};animation-delay:${(i * 0.37) % 2.4}s"></span>`).join('') : '';
  const title = boss ? (P.boss ? 'Monde 1 terminé !' : 'Défi terminé') : newly.length ? (newly.length > 1 ? `${newly.length} lignes maîtrisées !` : 'Ligne maîtrisée !') : stopped ? 'À demain !' : 'Leçon terminée !';
  const text = boss ? (P.boss ? `Vos ${DEPTH} coups sur les ${LINES.length} lignes du Monde 1 sont acquis. Le Monde 2 ajoutera de nouvelles lignes.` : '')
    : newly.length ? `${newly.map((t) => t.name).join(', ')} : Memo avance sur la carte ! Elles reviendront de temps en temps dans la révision du jour pour ne pas les oublier.`
    : 'Votre progression est gardée : vous reprendrez là où vous en êtes.';
  $('screen-end').innerHTML = `${conf}
    <div class="memo">${memoSvg('bravo')}</div>
    <h1>${title}</h1><p>${text}</p>
    <div class="stats">
      <div class="stat"><span>XP</span><b style="color:var(--gold)">+${S.xp}</b></div>
      <div class="stat"><span>Précision</span><b style="color:var(--good)">${acc} %</b></div>
      <div class="stat"><span>Erreurs</span><b style="color:${S.errors ? 'var(--bad)' : 'var(--fg)'}">${S.errors}</b></div>
    </div>
    ${boss ? '' : statusBlock()}
    <button class="btn btn-cta" id="end-continue">Continuer</button>`;
  show('end');
  $('end-continue').addEventListener('click', () => show('map'));
}

function openChest() {
  if (!P.chest) { P.chest = true; P.gems += 20; save(); }
  $('screen-end').innerHTML = `<div class="memo">${memoSvg('bravo')}</div><h1>Coffre ouvert !</h1><p>+20 gemmes. Plus tard, elles serviront à habiller Memo (chapeaux, lunettes, écharpes…).</p><div class="stats"><div class="stat"><span>Gemmes</span><b style="color:#8FD3FF">+20</b></div><div class="stat"><span>Total</span><b>${P.gems}</b></div><div class="stat"><span>Chemin</span><b>${Math.round(worldProgress().steps / worldProgress().total * 100)} %</b></div></div><button class="btn btn-cta" id="end-continue">Continuer</button>`;
  show('end'); $('end-continue').addEventListener('click', () => show('map'));
}

// Accroche de test (navigateur headless) : le coup attendu dans la position actuelle
window.__movemoryTest = () => { if (!S || !inputEnabled || !S.q) return null; const m = new Chess(game.fen()).move(S.q.move.san); const alt = new Chess(game.fen()).moves({ verbose: true }).find((x) => x.san !== m.san); return { from: m.from, to: m.to, alt: alt && { from: alt.from, to: alt.to }, mode: S.item.kind === 'partie' ? 'partie' : ['guidé', 'seul'][S.item.level], line: S.item.t.id }; };
loadRepertoire(REP);
renderMap();
requestAnimationFrame(renderMap);
</script>
