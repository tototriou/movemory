<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mauvais coup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F0D16}
a{color:#7EE2A2}a:hover{color:#B5F2C9}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icf{fill:currentColor;stroke:none}
@keyframes up{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.up{animation:up .4s cubic-bezier(.2,.9,.3,1.2) .35s both}
.shake{animation:shake .45s ease-in-out both}
@media (prefers-reduced-motion:reduce){.up,.shake{animation:none}}
.btn{background-image:linear-gradient(180deg,rgba(255,255,255,.24) 0,rgba(255,255,255,.07) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.1) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 10px 18px -6px rgba(0,0,0,.6);transition:transform .08s ease,filter .15s;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px)}
.btn-cta{position:relative;overflow:hidden;text-transform:uppercase;letter-spacing:.8px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn-cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,62%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.btn-cta::after{animation:none;display:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14121C; color: #FFFFFF; font-family: Fredoka, Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; padding: 18px 16px 8px">
    <a href="Main.dc.html" aria-label="Quitter la séance" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #B8B4C8">
      <svg width="26" height="26" viewBox="0 0 24 24" class="ic" style="stroke-width: 2.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </a>
    <div role="progressbar" aria-label="Progression de la séance" aria-valuenow="6" aria-valuemin="0" aria-valuemax="13" style="flex: 1; height: 16px; border-radius: 999px; background: #2E2A3D; overflow: hidden">
      <div style="width: 46%; height: 100%; border-radius: 999px; background: {{accent}}; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.22)"></div>
    </div>
    <span style="display: flex; align-items: center; gap: 3px; font-weight: 900; font-size: 16px; color: #8D89A0">
      <svg width="20" height="20" viewBox="0 0 24 24" class="icf" aria-hidden="true"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z"/></svg>x0
    </span>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 6px 16px 0">
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; font-weight: 800; color: #B8B4C8; text-transform: uppercase; letter-spacing: 1px">Révision · Blancs</span>
      <span style="font-size: 19px; font-weight: 900">Partie italienne – Giuoco Piano</span>
    </div>
    <div class="shake" style="display: flex; justify-content: center; border-radius: 8px; box-shadow: 0 6px 0 #0A0910">
      <dc-import name="Board" fen="r1bqk1nr/pppp1ppp/2n5/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R b KQkq - 0 4" size="{{boardSize}}" marks="{{marks}}" arrow="{{arrow}}" label="Vous avez joué 4.d3 ; la flèche verte montre 4.c3" hint-size="358px,358px"></dc-import>
    </div>
  </main>

  <section class="up" aria-live="polite" style="position: relative; background: #221F2E; border-top: 3px solid {{danger}}; border-radius: 22px 22px 0 0; padding: 18px 18px 26px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: {{danger}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" class="ic" style="stroke-width: 3.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </span>
      <span style="font-size: 21px; font-weight: 900; color: #FFFFFF">Pas votre ligne !</span>
    </div>
    <span class="pop" style="position: absolute; right: 14px; top: -74px">
      <dc-import name="Mascotte" size="88" mood="oups" hint-size="88px,88px"></dc-import>
    </span>

    <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; color: #FFFFFF"><b>Memo :</b> 4.d3 se joue, mais votre répertoire prévoit <b>4.c3</b> : il prépare d4 pour prendre le centre.</p>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: #B8B4C8">
      <svg width="18" height="18" viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h16"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>
      Cette position revient en fin de séance et demain.
    </div>
    <div style="display: flex; gap: 10px; padding-top: 4px">
      <a href="Seance.dc.html" style="flex: 1; text-align: center; text-decoration: none; background: transparent; border: 2px solid #3E3952; border-bottom-width: 5px; border-radius: 14px; padding: 11px; color: #FFFFFF; font-size: 17px; font-weight: 900">Rejouer</a>
      <a class="btn btn-cta" href="Bravo.dc.html" style="flex: 1.4; text-align: center; text-decoration: none; background-color: {{danger}}; border-bottom: 5px solid #8E2F20; border-radius: 14px; padding: 13px; color: #FFFFFF; font-size: 18px; font-weight: 900">Compris</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1A9E4B","options":["#1A9E4B","#7C4DFF","#FF7A1A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#1A9E4B',
      danger: '#C8442F',
      boardSize: 358,
      marks: [{ sq: 'd2', type: 'bad' }, { sq: 'd3', type: 'bad' }, { sq: 'c3', type: 'good' }],
      arrow: { from: 'c2', to: 'c3', color: '#1A9E4B' }
    };
  }
}
</script>
</body>
</html>
