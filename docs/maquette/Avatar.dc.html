<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="Avatar du joueur" style="width: {{size}}px; height: {{size}}px; border-radius: 50%; overflow: hidden; background: {{bg}}; font-family: Fredoka, Nunito, system-ui, sans-serif">
  <svg width="{{size}}" height="{{size}}" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="112" r="46" fill="{{bgShade}}"></circle>
    <path d="M14 104c2-22 16-32 36-32s34 10 36 32z" fill="{{shirt}}"></path>
    <path d="M40 73l10 11 10-11" style="fill: none; stroke: #FFFFFF; stroke-width: 3px; stroke-linecap: round; stroke-linejoin: round; opacity: .85"></path>
    <circle cx="68" cy="90" r="6" fill="#FFC94A"></circle>
    <path d="M66 93h5l-.6-2.6 1.4-1.8-1.2-2.4-2.6-.8-1.6 1.6 1 1.6-1.6 1.8z" fill="#7A4E05"></path>
    <rect x="43" y="58" width="14" height="16" rx="6" fill="{{skinShade}}"></rect>
    <circle cx="29" cy="47" r="5.5" fill="{{skinShade}}"></circle>
    <circle cx="71" cy="47" r="5.5" fill="{{skinShade}}"></circle>
    <ellipse cx="50" cy="44" rx="21" ry="23" fill="{{skin}}"></ellipse>
    <path d="M28 44c-1-17 9-27 23-27 14 0 23 10 22 26-5-8-12-11-20-12-6 5-14 9-25 13z" fill="{{hair}}"></path>
    <path d="M38 41q4-3 8 0M54 41q4-3 8 0" style="fill: none; stroke: {{hair}}; stroke-width: 2.4px; stroke-linecap: round"></path>
    <circle cx="42" cy="48" r="2.8" fill="#221C3D"></circle>
    <circle cx="58" cy="48" r="2.8" fill="#221C3D"></circle>
    <circle cx="43" cy="47" r=".9" fill="#FFFFFF"></circle>
    <circle cx="59" cy="47" r=".9" fill="#FFFFFF"></circle>
    <circle cx="36.5" cy="55" r="3.6" fill="#FF8C8C" style="opacity: .45"></circle>
    <circle cx="63.5" cy="55" r="3.6" fill="#FF8C8C" style="opacity: .45"></circle>
    <path d="M43 56q7 6.5 14 0" style="fill: none; stroke: #7A2E2E; stroke-width: 2.4px; stroke-linecap: round"></path>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":120,"min":24,"max":400},"skin":{"editor":"color","default":"#F2C29B","options":["#F8D7B8","#F2C29B","#C98C5E","#8A5A3B"]},"hair":{"editor":"color","default":"#3B2A20","options":["#3B2A20","#C9862E","#1E1A1A","#B84A3A"]},"shirt":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#7C4DFF","#F0605D","#2F7FC1"]},"bg":{"editor":"color","default":"#C4B5FD","options":["#C4B5FD","#FFC94A","#FDA4AF","#8EF0B4"]},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const shade = (hex, f) => {
      const n = parseInt(hex.slice(1), 16);
      const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(v * f));
      return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
    };
    const skin = this.props.skin ?? '#F2C29B';
    const bg = this.props.bg ?? '#C4B5FD';
    return {
      size: Number(this.props.size ?? 120),
      skin,
      skinShade: shade(skin, 0.88),
      hair: this.props.hair ?? '#3B2A20',
      shirt: this.props.shirt ?? '#FF7A1A',
      bg,
      bgShade: shade(bg, 0.85)
    };
  }
}
</script>
</body>
</html>
