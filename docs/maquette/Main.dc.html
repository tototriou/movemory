<style>
body{margin:0;background:#0F0D16}
a{color:#7EE2A2}a:hover{color:#B5F2C9}
.ic{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icf{fill:currentColor;stroke:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:.7;transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14) rotate(4deg)}}
@keyframes lamp{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes shimmer{0%{background-position:-160px 0}100%{background-position:300px 0}}
.shimmer{background-image:linear-gradient(100deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 70%);background-size:160px 100%;background-repeat:no-repeat;animation:shimmer 2.4s linear infinite}
.bob{animation:bob 1.5s ease-in-out infinite}
.glow{animation:glow 1.6s ease-in-out infinite}
.pop{animation:pop .5s .2s ease-out both}
.wiggle{animation:wiggle 3s ease-in-out infinite;transform-origin:50% 70%}
.flicker{animation:flicker .9s ease-in-out infinite;transform-origin:50% 90%}
.lamp{animation:lamp 2.6s ease-in-out infinite}
.sway{animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
@media (prefers-reduced-motion:reduce){.shimmer,.bob,.glow,.pop,.wiggle,.flicker,.lamp,.sway{animation:none}}
.btn{background-image:linear-gradient(180deg,rgba(255,255,255,.24) 0,rgba(255,255,255,.07) 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.1) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 10px 18px -6px rgba(0,0,0,.6);transition:transform .08s ease,filter .15s;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px)}
.btn-cta{position:relative;overflow:hidden;text-transform:uppercase;letter-spacing:.8px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn-cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,62%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){.btn-cta::after{animation:none;display:none}}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1A9E4B","options":["#1A9E4B","#7C4DFF","#FF7A1A"]},"world":{"editor":"enum","options":["italie","foret","nuit"],"default":"italie"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#1A9E4B';
    const worlds = {
      italie: { a: '#8A4A2A', b: '#7A3F22', tile: ['#8B5CF6', '#A78BFA', '#6D28D9', '#5B21B6'] },
      foret: { a: '#24502E', b: '#1E4428', tile: ['#3FA0A8', '#56B4BC', '#2C7A80', '#22656A'] },
      nuit: { a: '#2C2A5A', b: '#25234D', tile: ['#7A68E0', '#8E7DF0', '#5848B0', '#4A3C96'] }
    };
    const w = worlds[this.props.world] || worlds.italie;
    const coords = [
      [120, 650], [170, 616], [220, 582], [270, 548], [220, 514], [170, 480],
      [120, 446], [170, 412], [220, 378], [270, 344], [220, 310], [170, 276]
    ];
    const tiles = coords.map(([cx, cy], i) => {
      const n = i + 1;
      const done = n <= 2;
      const chest = n === 8;
      const boss = n === 12;
      let c = w.tile;
      if (done) c = ['#FFC94A', '#FFD976', '#C9951E', '#A87B12'];
      if (chest) c = ['#A86E35', '#BE8448', '#7A4E22', '#5F3C1A'];
      if (boss) c = ['#3A2420', '#4A302A', '#24140F', '#1A0E0A'];
      return {
        cy, done, chest, boss,
        top: c[0], bevel: c[1], left: c[2], right: c[3],
        wrap: 'position: absolute; left: ' + (cx - 55) + 'px; top: ' + (cy - 36) + 'px; width: 110px; height: 90px',
        label: done || chest || boss || n === 3 ? '' : String(n),
        labelStyle: 'position: absolute; left: 0; right: 0; top: 20px; text-align: center; font-size: 26px; font-weight: 900; color: #FFFFFF; text-shadow: 0 3px 0 ' + c[2]
      };
    }).sort((a, b) => a.cy - b.cy);
    return { accent, checkA: w.a, checkB: w.b, tiles };
  }
}
</script>
