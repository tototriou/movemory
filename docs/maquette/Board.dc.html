<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Échiquier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{label}}" style="text-decoration: none; position: relative; width: {{size}}px; height: {{size}}px; border-radius: 6px; overflow: hidden; font-family: 'DejaVu Sans', 'Segoe UI Symbol', system-ui, sans-serif; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr))">
  <sc-for list="{{squares}}" as="s" hint-placeholder-count="64">
    <div style="{{s.style}}">
      <span style="{{s.pieceStyle}}">{{s.glyph}}</span>
      <span style="{{s.rankStyle}}">{{s.rank}}</span>
      <span style="{{s.fileStyle}}">{{s.file}}</span>
    </div>
  </sc-for>
  <sc-if value="{{hasArrow}}" hint-placeholder-val="{{ false }}">
    <svg width="{{size}}" height="{{size}}" viewBox="0 0 {{size}} {{size}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; pointer-events: none">
      <line x1="{{arrow.x1}}" y1="{{arrow.y1}}" x2="{{arrow.x2}}" y2="{{arrow.y2}}" style="{{arrow.lineStyle}}"></line>
      <polygon points="{{arrow.head}}" fill="{{arrow.color}}" style="opacity: 0.88"></polygon>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fen":{"editor":"text","default":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR"},"size":{"editor":"int","default":358,"min":200,"max":600},"orientation":{"editor":"enum","options":["w","b"],"default":"w"},"marks":{"editor":null},"arrow":{"editor":null},"$preview":{"width":358,"height":358}}'>
class Component extends DCLogic {
  renderVals() {
    const fen = this.props.fen || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
    const size = Number(this.props.size ?? 358);
    const flip = this.props.orientation === 'b';
    const marks = this.props.marks || [];
    const cell = size / 8;
    const files = 'abcdefgh';
    const glyphs = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
    const markColors = {
      last: ['#F5F682', '#B9CA43'],
      bad: ['#F2A08F', '#D9654F'],
      good: ['#B8E6C4', '#5DBB7A'],
      hint: ['#9CC8F0', '#5E9ED8']
    };
    const rows = fen.split(' ')[0].split('/').map((r) => r.replace(/\d/g, (d) => '.'.repeat(Number(d))).split(''));
    const squares = [];
    for (let i = 0; i < 8; i++) {
      for (let j = 0; j < 8; j++) {
        const r = flip ? 7 - i : i;
        const f = flip ? 7 - j : j;
        const sq = files[f] + (8 - r);
        const light = (r + f) % 2 === 0;
        const mark = marks.find((m) => m.sq === sq);
        const bg = mark ? markColors[mark.type][light ? 0 : 1] : (light ? '#F2E8D5' : '#6D8FB3');
        const p = (rows[r] || [])[f] || '.';
        const white = p !== '.' && p === p.toUpperCase();
        const labelColor = light ? '#56769A' : '#F2E8D5';
        squares.push({
          style: 'position: relative; background: ' + bg + '; display: flex; align-items: center; justify-content: center; height: ' + cell + 'px',
          glyph: p === '.' ? '' : glyphs[p.toLowerCase()] + '︎',
          pieceStyle: 'font-size: ' + (cell * 0.84) + 'px; line-height: 1; color: ' + (white ? '#FFFFFF' : '#2A2725') + '; text-shadow: ' +
            (white ? '0 0 1.5px #1A1A1A, 0 0 1.5px #1A1A1A, 0 2px 1px rgba(0,0,0,.35)' : '0 0 1px rgba(255,255,255,.25), 0 2px 1px rgba(0,0,0,.3)'),
          rank: j === 0 ? String(8 - r) : '',
          file: i === 7 ? files[f] : '',
          rankStyle: 'position: absolute; left: 3px; top: 1px; font-size: ' + (cell * 0.24) + 'px; font-weight: 800; color: ' + labelColor + '; font-family: Fredoka, Nunito, system-ui, sans-serif',
          fileStyle: 'position: absolute; right: 3px; bottom: 0; font-size: ' + (cell * 0.24) + 'px; font-weight: 800; color: ' + labelColor + '; font-family: Fredoka, Nunito, system-ui, sans-serif'
        });
      }
    }
    const center = (sq) => {
      const f = files.indexOf(sq[0]);
      const r = 8 - Number(sq[1]);
      const x = (flip ? 7 - f : f) * cell + cell / 2;
      const y = (flip ? 7 - r : r) * cell + cell / 2;
      return [x, y];
    };
    let arrow = null;
    const a = this.props.arrow;
    if (a && a.from && a.to) {
      const [x1, y1] = center(a.from);
      const [tx, ty] = center(a.to);
      const len = Math.hypot(tx - x1, ty - y1) || 1;
      const ux = (tx - x1) / len;
      const uy = (ty - y1) / len;
      const headLen = cell * 0.45;
      const headW = cell * 0.32;
      const bx = tx - ux * headLen;
      const by = ty - uy * headLen;
      const color = a.color || '#5FA83A';
      arrow = {
        x1, y1, x2: bx, y2: by, color,
        lineStyle: 'stroke: ' + color + '; stroke-width: ' + (cell * 0.2) + 'px; stroke-linecap: round; opacity: 0.88',
        head: [tx + ',' + ty, (bx - uy * headW) + ',' + (by + ux * headW), (bx + uy * headW) + ',' + (by - ux * headW)].join(' ')
      };
    }
    return { size, squares, hasArrow: !!arrow, arrow: arrow || {}, label: this.props.label || 'Échiquier' };
  }
}
</script>
</body>
</html>
